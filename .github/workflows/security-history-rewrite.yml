name: Security history audit and email rewrite

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/security-history-rewrite.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: security-history-rewrite
  cancel-in-progress: false

jobs:
  audit-and-rewrite:
    runs-on: ubuntu-latest
    if: github.repository == 'testeste55555/tet'
    steps:
      - name: Checkout full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Prepare rollback branch
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          OLD_SHA="$(git rev-parse HEAD)"
          OLD_TREE="$(git rev-parse HEAD^{tree})"
          echo "OLD_SHA=$OLD_SHA" >> "$GITHUB_ENV"
          echo "OLD_TREE=$OLD_TREE" >> "$GITHUB_ENV"
          git push origin "$OLD_SHA:refs/heads/security-backup-pre-rewrite"
          echo "Temporary rollback branch created."

      - name: Audit current files and reachable history for secret patterns
        shell: bash
        run: |
          set -euo pipefail
          : > secret-audit.txt

          scan_rule() {
            local rule="$1"
            local regex="$2"
            local rev path key
            declare -A seen=()
            while IFS= read -r rev; do
              while IFS= read -r path; do
                [ -z "$path" ] && continue
                key="$rule|$path"
                if [[ -z "${seen[$key]+x}" ]]; then
                  seen[$key]=1
                  printf 'content|%s|%s|%s\n' "$rule" "$rev" "$path" >> secret-audit.txt
                fi
              done < <(git grep -IlE "$regex" "$rev" -- . ':(exclude).github/workflows/security-history-rewrite.yml' 2>/dev/null || true)
            done < <(git rev-list main)
          }

          scan_rule github-token 'gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}'
          scan_rule private-key '-----BEGIN ([A-Z0-9]+ )?PRIVATE KEY-----'
          scan_rule aws-access-key 'AKIA[0-9A-Z]{16}'
          scan_rule google-api-key 'AIza[0-9A-Za-z_-]{35}'
          scan_rule openai-key 'sk-(proj-)?[A-Za-z0-9_-]{20,}'
          scan_rule slack-token 'xox[baprs]-[A-Za-z0-9-]{20,}'
          scan_rule stripe-live-key 'sk_live_[A-Za-z0-9]{16,}'
          scan_rule bearer-token 'Bearer[[:space:]]+[A-Za-z0-9._~+/-]{24,}={0,2}'
          scan_rule generic-secret-assignment '(api[_-]?key|access[_-]?token|auth[_-]?token|client[_-]?secret|password|passwd|secret|aws_secret_access_key).{0,16}[:=].{0,6}[A-Za-z0-9_./+=-]{12,}'

          declare -A filename_seen=()
          while IFS= read -r rev; do
            while IFS= read -r path; do
              if [[ "$path" =~ (^|/)(\.env($|\.)|\.npmrc$|\.netrc$|\.git-credentials$|[^/]*(credential|service[-_]?account|client[-_]?secret|secrets?|tokens?)[^/]*|[^/]+\.(pem|key|p12|pfx|jks|keystore|db|sqlite|sqlite3)$) ]]; then
                key="$path"
                if [[ -z "${filename_seen[$key]+x}" ]]; then
                  filename_seen[$key]=1
                  printf 'filename|sensitive-name|%s|%s\n' "$rev" "$path" >> secret-audit.txt
                fi
              fi
            done < <(git ls-tree -r --name-only "$rev")
          done < <(git rev-list main)

          sort -u -o secret-audit.txt secret-audit.txt
          CONTENT_COUNT="$(grep -c '^content|' secret-audit.txt || true)"
          FILENAME_COUNT="$(grep -c '^filename|' secret-audit.txt || true)"
          echo "SECRET_AUDIT_CONTENT_FINDINGS=$CONTENT_COUNT"
          echo "SECRET_AUDIT_FILENAME_FINDINGS=$FILENAME_COUNT"
          if [ -s secret-audit.txt ]; then
            echo "Sanitized candidate list (no secret values):"
            cat secret-audit.txt
          else
            echo "No candidate secret content or sensitive filenames detected in reachable main history."
          fi

      - name: Rewrite author and committer email to GitHub noreply
        shell: bash
        run: |
          set -euo pipefail
          export FILTER_BRANCH_SQUELCH_WARNING=1
          git filter-branch --force --env-filter '
            export GIT_AUTHOR_NAME="testeste55555"
            export GIT_AUTHOR_EMAIL="258153139+testeste55555@users.noreply.github.com"
            export GIT_COMMITTER_NAME="testeste55555"
            export GIT_COMMITTER_EMAIL="258153139+testeste55555@users.noreply.github.com"
          ' -- main

          NEW_TREE="$(git rev-parse main^{tree})"
          if [ "$NEW_TREE" != "$OLD_TREE" ]; then
            echo "Tree changed during metadata-only rewrite; refusing to push."
            exit 1
          fi

          if git log main --format='%ae%n%ce' | grep -Ev '(^258153139\+testeste55555@users\.noreply\.github\.com$)' | grep -q .; then
            echo "Non-noreply author/committer email remains after rewrite."
            exit 1
          fi

          git push --force-with-lease=refs/heads/main:"$OLD_SHA" origin main:main
          echo "Rewritten main pushed successfully."

      - name: Remove temporary rollback branch after successful rewrite
        shell: bash
        run: |
          set -euo pipefail
          git push origin --delete security-backup-pre-rewrite
          echo "Temporary rollback branch removed."
