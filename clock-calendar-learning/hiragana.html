<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>時計・カレンダー（ひらがな版）</title><style>
:root{--p:#2563eb;--a:#f59e0b;--t:#1f2937;--l:#d8e0ea;--g:#f3f7fb}*{box-sizing:border-box}html,body{margin:0;height:100%}body{height:100dvh;overflow:hidden;font-family:"UD Digi Kyokasho N-R","UD デジタル 教科書体 N-R","BIZ UDPGothic","Yu Gothic","Meiryo",sans-serif;font-weight:400;color:var(--t);background:#edf3f9}button,select{font:inherit;font-weight:400}.app{height:100dvh;max-width:1000px;margin:auto;padding:6px;display:grid;grid-template-rows:44px minmax(0,1fr);gap:6px}.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px}.mode{border:2px solid transparent;border-radius:10px;background:#fff;font-weight:400;font-size:1.18rem;box-shadow:0 3px 12px #1f29371a}.mode.on{border-color:var(--p);background:#eaf1ff;color:#174bb6}.panel{min-height:0;background:#fff;border-radius:13px;padding:6px;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:6px;box-shadow:0 4px 16px #1f29371a}.head{min-height:38px;display:grid;grid-template-columns:150px 1fr 150px;align-items:center;gap:6px}.setting{display:flex;gap:5px;align-items:center;font-size:.92rem;font-weight:400;color:#667085}select{height:34px;border:1px solid var(--l);border-radius:8px;background:#fff;font-size:1.06rem}h1{grid-column:2;margin:0;text-align:center;font-size:clamp(1.34rem,4.2vw,1.9rem);font-weight:400}.stage{min-height:0;overflow:hidden;position:relative;contain:layout paint;border:2px solid #e0e6ee;border-radius:11px;background:#fbfdff;display:grid;place-items:center;padding:3px}.clock{width:100%;height:100%;max-width:650px;max-height:650px;display:grid;place-items:center;justify-self:center;align-self:center;margin:auto;overflow:hidden}svg{display:block;width:100%;height:100%;max-width:100%;max-height:100%}.face{fill:#fff;stroke:#1f2937;stroke-width:5}.tick{stroke:#475467;stroke-linecap:round}.num{font-size:27px;font-weight:400;text-anchor:middle;dominant-baseline:central}.hh{stroke:#111827;stroke-width:10;stroke-linecap:round}.mh{stroke:var(--p);stroke-width:7;stroke-linecap:round}.dot{fill:var(--a);stroke:#111827;stroke-width:2}.cal{width:100%;height:100%;display:grid;grid-template-rows:76px minmax(0,1fr);gap:10px;padding-top:4px}.mon{display:grid;place-items:center;font-size:clamp(2.4rem,7.5vw,3.8rem);font-weight:400;line-height:1;padding:8px 0 6px}.grid{min-height:0;display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(25px,1fr);gap:3px}.wd,.d{display:grid;place-items:center;border-radius:7px;font-weight:400}.wd{background:#edf2f7;border:1px solid var(--l);font-size:clamp(.96rem,2.9vw,1.36rem);color:#667085;margin-top:10px}.d{border:2px solid var(--l);font-size:clamp(1.22rem,4.6vw,2.04rem)}.empty{border-color:transparent}.sun{color:#c2410c}.sat{color:#1d4ed8}.hit{position:relative;z-index:10;border:4px solid var(--a);background:#fff3c4;color:#111827;transform-origin:center;animation:p .8s ease-in-out infinite alternate;will-change:transform,box-shadow}@keyframes p{from{transform:scale(1.08);box-shadow:0 0 10px #f59e0b55}to{transform:scale(1.22);box-shadow:0 0 24px #f59e0baa}}.dock{display:grid;grid-template-columns:minmax(0,1fr) 145px 145px;gap:6px;min-height:84px}.answer{min-height:84px;background:#edf7f5;border-radius:10px;display:grid;place-items:center;text-align:center;padding:6px 12px;color:#0f766e;font-size:clamp(1.92rem,6.25vw,3.22rem);font-weight:400;line-height:1.08}.hide{visibility:hidden}.act{border:0;border-radius:10px;font-weight:400;font-size:1.08rem;min-height:84px}.new{background:var(--p);color:#fff}.show{background:#e7edf3}[hidden]{display:none!important}
@media(max-width:650px){.app{grid-template-rows:40px minmax(0,1fr);padding:4px;gap:4px}.panel{padding:4px;gap:4px}.head{grid-template-columns:auto 1fr;min-height:34px}.setting{grid-column:1;font-size:.88rem}h1{grid-column:2;font-size:1.25rem}.clock{width:100%;height:100%;max-width:560px;max-height:560px}.num{font-size:26px}.dock{grid-template-columns:1fr 1fr;grid-template-areas:"a a" "n s";grid-template-rows:74px 46px;gap:4px;min-height:124px}.answer{grid-area:a;min-height:74px;font-size:clamp(1.82rem,6.15vw,2.88rem)}.new{grid-area:n}.show{grid-area:s}.act{min-height:46px;font-size:1.05rem}.cal{grid-template-rows:58px minmax(0,1fr);gap:6px;padding-top:2px}.mon{font-size:clamp(2.15rem,7.2vw,3.3rem)}.wd{font-size:clamp(.92rem,2.9vw,1.25rem)}.d{font-size:clamp(1.16rem,4.65vw,1.86rem)}.grid{grid-auto-rows:minmax(22px,1fr)}}
@media(max-height:700px){.app{grid-template-rows:38px minmax(0,1fr)}.mode{font-size:1rem}.head{min-height:30px}.clock{width:100%;height:100%;max-width:480px;max-height:480px}.answer{min-height:64px;font-size:clamp(1.72rem,5.8vw,2.55rem)}.act{min-height:64px}}
@media(max-width:650px) and (max-height:700px){.dock{grid-template-rows:64px 40px;min-height:108px}.answer{min-height:64px}.act{min-height:40px}}
</style></head><body><main class="app"><div class="modes"><button id="cb" class="mode on">🕒 時計</button><button id="db" class="mode">📅 カレンダー</button></div><section class="panel"><div class="head"><div id="set" class="setting"><label>分の単位</label><select id="step"><option value="5">5分単位</option><option value="1">1分単位</option></select></div><h1 id="q">なんじ　なんぷんですか</h1></div><div class="stage"><div id="cv" class="clock"><svg viewBox="0 0 400 400"><circle class="face" cx="200" cy="200" r="175"/><g id="ticks"/><g id="nums"/><line id="hh" class="hh" x1="200" y1="200"/><line id="mh" class="mh" x1="200" y1="200"/><circle class="dot" cx="200" cy="200" r="10"/></svg></div><div id="dv" class="cal" hidden><div id="mon" class="mon"></div><div id="grid" class="grid"></div></div></div><div class="dock"><div class="answer"><span id="ans" class="hide">答え</span></div><button id="new" class="act new">問題を出す</button><button id="show" class="act show">答えを見る</button></div></section></main><script>
"use strict";const S={mode:"c",clock:null,date:null,visible:false},$=id=>document.getElementById(id),cb=$("cb"),db=$("db"),set=$("set"),step=$("step"),q=$("q"),cv=$("cv"),dv=$("dv"),hh=$("hh"),mh=$("mh"),ticks=$("ticks"),nums=$("nums"),mon=$("mon"),grid=$("grid"),a=$("ans"),nb=$("new"),sb=$("show");const rnd=(x,y)=>Math.floor(Math.random()*(y-x+1))+x;
function num(n){const o=["","いち","に","さん","よん","ご","ろく","なな","はち","きゅう"];if(n===0)return"れい";if(n<10)return o[n];if(n<20)return"じゅう"+o[n-10];const t=Math.floor(n/10),r=n%10;return o[t]+"じゅう"+o[r]}
function hr(h){return({1:"いちじ",2:"にじ",3:"さんじ",4:"よじ",5:"ごじ",6:"ろくじ",7:"しちじ",8:"はちじ",9:"くじ",10:"じゅうじ",11:"じゅういちじ",12:"じゅうにじ"})[h]}
function mn(m){const s={1:"いっぷん",2:"にふん",3:"さんぷん",4:"よんぷん",5:"ごふん",6:"ろっぷん",7:"ななふん",8:"はっぷん",9:"きゅうふん",10:"じゅっぷん"};if(m<=10)return s[m];const t=Math.floor(m/10),u=m%10,b=(t===1?"じゅう":num(t)+"じゅう");return u?b+s[u]:b.replace("じゅう","じゅっぷん")}
function clockAnswer(h,m){const x=hr(h);if(m===0)return x;if(m===30)return`${x}　${mn(m)}<br>${x}　はん`;return`${x}　${mn(m)}`}
function month(m){return({1:"いちがつ",2:"にがつ",3:"さんがつ",4:"しがつ",5:"ごがつ",6:"ろくがつ",7:"しちがつ",8:"はちがつ",9:"くがつ",10:"じゅうがつ",11:"じゅういちがつ",12:"じゅうにがつ"})[m]}
function day(d){return({1:"ついたち",2:"ふつか",3:"みっか",4:"よっか",5:"いつか",6:"むいか",7:"なのか",8:"ようか",9:"ここのか",10:"とおか",11:"じゅういちにち",12:"じゅうににち",13:"じゅうさんにち",14:"じゅうよっか",15:"じゅうごにち",16:"じゅうろくにち",17:"じゅうしちにち",18:"じゅうはちにち",19:"じゅうくにち",20:"はつか",21:"にじゅういちにち",22:"にじゅうににち",23:"にじゅうさんにち",24:"にじゅうよっか",25:"にじゅうごにち",26:"にじゅうろくにち",27:"にじゅうしちにち",28:"にじゅうはちにち",29:"にじゅうくにち",30:"さんじゅうにち",31:"さんじゅういちにち"})[d]}
function end(l,len,deg){const r=(deg-90)*Math.PI/180;l.setAttribute("x2",200+Math.cos(r)*len);l.setAttribute("y2",200+Math.sin(r)*len)}
function face(){const ns="http://www.w3.org/2000/svg";for(let i=0;i<60;i++){const r=(i*6-90)*Math.PI/180,H=i%5===0,l=document.createElementNS(ns,"line"),o=164,n=H?147:155;l.setAttribute("x1",200+Math.cos(r)*n);l.setAttribute("y1",200+Math.sin(r)*n);l.setAttribute("x2",200+Math.cos(r)*o);l.setAttribute("y2",200+Math.sin(r)*o);l.setAttribute("class","tick");l.setAttribute("stroke-width",H?4:2);ticks.appendChild(l)}for(let i=1;i<=12;i++){const r=(i*30-90)*Math.PI/180,t=document.createElementNS(ns,"text");t.setAttribute("x",200+Math.cos(r)*124);t.setAttribute("y",200+Math.sin(r)*124);t.setAttribute("class","num");t.textContent=i;nums.appendChild(t)}}
function hide(){S.visible=false;a.classList.add("hide");sb.textContent="答えを見る"}
function clockQ(){const st=+step.value;let h,m,n=0;do{h=rnd(1,12);m=st===1?rnd(0,59):rnd(0,11)*5;n++}while(S.clock&&S.clock.h===h&&S.clock.m===m&&n<20);S.clock={h,m};end(mh,135,m*6);end(hh,94,(h%12)*30+m*.5);a.innerHTML=clockAnswer(h,m);hide()}
const dim=(y,m)=>new Date(y,m+1,0).getDate();
function calQ(){const y=new Date().getFullYear();let m,d,n=0;do{m=rnd(0,11);d=rnd(1,dim(y,m));n++}while(S.date&&S.date.m===m&&S.date.d===d&&n<20);S.date={m,d};grid.innerHTML="";["日","月","火","水","木","金","土"].forEach((x,i)=>{const e=document.createElement("div");e.className="wd "+(i===0?"sun":i===6?"sat":"");e.textContent=x;grid.appendChild(e)});const first=new Date(y,m,1).getDay();for(let i=0;i<first;i++){const e=document.createElement("div");e.className="d empty";grid.appendChild(e)}for(let x=1;x<=dim(y,m);x++){const w=new Date(y,m,x).getDay(),e=document.createElement("div");e.className="d "+(w===0?"sun ":w===6?"sat ":"")+(x===d?"hit":"");e.textContent=x;grid.appendChild(e)}mon.textContent=`${m+1}月`;a.textContent=`${month(m+1)}　${day(d)}`;hide()}
function mode(x){S.mode=x;const c=x==="c";cb.classList.toggle("on",c);db.classList.toggle("on",!c);set.hidden=!c;cv.hidden=!c;dv.hidden=c;q.textContent=c?"なんじ　なんぷんですか":"なんがつ　なんにちですか";c?clockQ():calQ()}
cb.onclick=()=>mode("c");db.onclick=()=>mode("d");nb.onclick=()=>S.mode==="c"?clockQ():calQ();sb.onclick=()=>{S.visible=!S.visible;a.classList.toggle("hide",!S.visible);sb.textContent=S.visible?"答えを隠す":"答えを見る"};face();clockQ();
</script></body></html>
