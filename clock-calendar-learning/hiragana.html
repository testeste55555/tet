<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>時計・カレンダー よみとり練習（ひらがな版）</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #667085;
      --line: #d0d5dd;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --accent: #f59e0b;
      --accent-soft: #fff3c4;
      --success: #0f766e;
      --shadow: 0 10px 28px rgba(31, 41, 55, 0.10);
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "BIZ UDPGothic", "Yu Gothic", "Meiryo", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, #e8f0ff 0, transparent 32%),
        linear-gradient(180deg, #f9fbff 0%, var(--bg) 100%);
    }

    button,
    select,
    input {
      font: inherit;
    }

    .app {
      width: min(980px, calc(100% - 28px));
      margin: 0 auto;
      padding: 24px 0 40px;
    }

    .app-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .app-header h1 {
      margin: 0;
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      letter-spacing: 0.04em;
    }

    .app-header p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .mode-switch {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }

    .mode-button {
      min-height: 72px;
      border: 2px solid transparent;
      border-radius: 16px;
      background: var(--panel);
      color: var(--text);
      box-shadow: var(--shadow);
      cursor: pointer;
      font-weight: 700;
      font-size: 1.2rem;
      transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease;
    }

    .mode-button:hover {
      transform: translateY(-2px);
    }

    .mode-button.active {
      border-color: var(--primary);
      background: #eef4ff;
      color: var(--primary-dark);
    }

    .panel {
      background: var(--panel);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: clamp(18px, 3vw, 30px);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: end;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .settings {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: end;
    }

    .setting {
      display: grid;
      gap: 6px;
    }

    .setting label {
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 700;
    }

    .setting select,
    .setting input {
      min-height: 44px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 12px;
      background: white;
    }

    .primary-button,
    .secondary-button {
      min-height: 48px;
      border: none;
      border-radius: 12px;
      padding: 10px 22px;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease;
    }

    .primary-button {
      background: var(--primary);
      color: white;
    }

    .secondary-button {
      background: #edf2f7;
      color: var(--text);
    }

    .primary-button:hover,
    .secondary-button:hover {
      transform: translateY(-1px);
      filter: brightness(0.97);
    }

    .question-title {
      margin: 0 0 14px;
      text-align: center;
      font-size: clamp(1.25rem, 3vw, 1.65rem);
    }

    .stage {
      min-height: 470px;
      display: grid;
      place-items: center;
      border: 2px dashed #dbe3ef;
      border-radius: 16px;
      padding: 18px;
      background: #fbfdff;
    }

    .clock-wrap {
      width: min(520px, 100%);
      aspect-ratio: 1 / 1;
      display: grid;
      place-items: center;
    }

    #clockSvg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .clock-face {
      fill: #ffffff;
      stroke: #1f2937;
      stroke-width: 5;
    }

    .clock-tick {
      stroke: #475467;
      stroke-linecap: round;
    }

    .clock-number {
      font-size: 22px;
      font-weight: 800;
      fill: #111827;
      text-anchor: middle;
      dominant-baseline: central;
    }

    .hour-hand {
      stroke: #111827;
      stroke-width: 10;
      stroke-linecap: round;
    }

    .minute-hand {
      stroke: var(--primary);
      stroke-width: 7;
      stroke-linecap: round;
    }

    .center-dot {
      fill: var(--accent);
      stroke: #111827;
      stroke-width: 2;
    }

    .calendar-wrap {
      width: min(900px, 100%);
    }

    .calendar-header {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 14px;
      font-weight: 900;
    }

    .calendar-month {
      font-size: clamp(2.4rem, 7vw, 3.8rem);
      letter-spacing: 0.06em;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 9px;
    }

    .weekday,
    .day-cell {
      min-height: 72px;
      display: grid;
      place-items: center;
      border-radius: 12px;
      font-weight: 900;
    }

    .weekday {
      color: var(--muted);
      background: #eef2f6;
      font-size: clamp(1.15rem, 3vw, 1.5rem);
      border: 1px solid #d8dee8;
    }

    .weekday.sun,
    .day-cell.sun {
      color: #c2410c;
    }

    .weekday.sat,
    .day-cell.sat {
      color: #1d4ed8;
    }

    .day-cell {
      position: relative;
      background: white;
      border: 2px solid #d8dee8;
      font-size: clamp(1.5rem, 4.6vw, 2.15rem);
    }

    .day-cell.empty {
      border-color: transparent;
      background: transparent;
    }

    .day-cell.highlight {
      color: #111827;
      background: var(--accent-soft);
      border: 5px solid var(--accent);
      animation: pulse 1s ease-in-out infinite alternate;
      z-index: 1;
    }

    .day-cell.highlight::after {
      content: "";
      position: absolute;
      inset: -7px;
      border: 3px solid rgba(245, 158, 11, 0.35);
      border-radius: 14px;
    }

    @keyframes pulse {
      from {
        transform: scale(1);
        box-shadow: 0 0 0 rgba(245, 158, 11, 0);
      }
      to {
        transform: scale(1.05);
        box-shadow: 0 0 24px rgba(245, 158, 11, 0.40);
      }
    }

    .answer-area {
      margin-top: 16px;
      min-height: 72px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      background: #f8fafc;
      text-align: center;
      padding: 14px;
    }

    .answer {
      margin: 0;
      font-size: clamp(1.3rem, 4vw, 2rem);
      font-weight: 900;
      line-height: 1.55;
      color: var(--success);
    }

    .answer.hidden {
      visibility: hidden;
    }

    .footer-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    [hidden] {
      display: none !important;
    }

    button:focus-visible,
    select:focus-visible,
    input:focus-visible {
      outline: 4px solid rgba(37, 99, 235, 0.25);
      outline-offset: 2px;
    }

    @media (max-width: 640px) {
      .stage {
        min-height: 390px;
        padding: 10px;
      }

      .toolbar {
        align-items: stretch;
      }

      .settings {
        width: 100%;
      }

      .setting {
        flex: 1 1 140px;
      }

      .primary-button {
        width: 100%;
      }

      .weekday,
      .day-cell {
        min-height: 54px;
      }

      .calendar-grid {
        gap: 5px;
      }

      .day-cell {
        font-size: clamp(1.15rem, 5vw, 1.55rem);
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>時計・カレンダー よみとり練習（ひらがな版）</h1>
      <p>モードを選び、「問題を出す」を押してください。</p>
    </header>

    <section class="mode-switch" aria-label="練習モード">
      <button id="clockModeButton" class="mode-button active" type="button" aria-pressed="true">
        🕒 時計
      </button>
      <button id="calendarModeButton" class="mode-button" type="button" aria-pressed="false">
        📅 カレンダー
      </button>
    </section>

    <section class="panel">
      <div class="toolbar">
        <div class="settings">
          <div id="clockSettings" class="setting">
            <label for="minuteStep">分の単位</label>
            <select id="minuteStep">
              <option value="5" selected>5分単位</option>
              <option value="1">1分単位</option>
            </select>
          </div>
        </div>

        <button id="newQuestionButton" class="primary-button" type="button">
          問題を出す
        </button>
      </div>

      <h2 id="questionTitle" class="question-title">なんじ　なんぷんですか</h2>

      <div class="stage" aria-live="polite">
        <div id="clockView" class="clock-wrap">
          <svg id="clockSvg" viewBox="0 0 400 400" role="img" aria-label="アナログ時計">
            <circle class="clock-face" cx="200" cy="200" r="175"></circle>
            <g id="ticks"></g>
            <g id="numbers"></g>
            <line id="hourHand" class="hour-hand" x1="200" y1="200" x2="200" y2="105"></line>
            <line id="minuteHand" class="minute-hand" x1="200" y1="200" x2="200" y2="65"></line>
            <circle class="center-dot" cx="200" cy="200" r="10"></circle>
          </svg>
        </div>

        <div id="calendarView" class="calendar-wrap" hidden>
          <div class="calendar-header">
            <span id="calendarMonth" class="calendar-month"></span>
            
          </div>
          <div id="calendarGrid" class="calendar-grid" role="grid" aria-label="カレンダー"></div>
        </div>
      </div>

      <div class="answer-area">
        <p id="answerText" class="answer hidden">答え</p>
      </div>

      <div class="footer-actions">
        <button id="showAnswerButton" class="secondary-button" type="button">答えを見る</button>
      </div>

</section>
  </main>

  <script>
    "use strict";

    const state = {
      mode: "clock",
      currentClock: null,
      currentDate: null,
      answerVisible: false
    };

    const elements = {
      clockModeButton: document.getElementById("clockModeButton"),
      calendarModeButton: document.getElementById("calendarModeButton"),
      clockSettings: document.getElementById("clockSettings"),
      minuteStep: document.getElementById("minuteStep"),
      newQuestionButton: document.getElementById("newQuestionButton"),
      showAnswerButton: document.getElementById("showAnswerButton"),
      questionTitle: document.getElementById("questionTitle"),
      clockView: document.getElementById("clockView"),
      calendarView: document.getElementById("calendarView"),
      hourHand: document.getElementById("hourHand"),
      minuteHand: document.getElementById("minuteHand"),
      ticks: document.getElementById("ticks"),
      numbers: document.getElementById("numbers"),
      calendarMonth: document.getElementById("calendarMonth"),
      calendarGrid: document.getElementById("calendarGrid"),
      answerText: document.getElementById("answerText")
    };

    function randomInt(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function numberToHiragana(number) {
      const ones = ["", "いち", "に", "さん", "よん", "ご", "ろく", "なな", "はち", "きゅう"];

      if (number === 0) return "れい";
      if (number < 10) return ones[number];
      if (number < 20) return "じゅう" + ones[number - 10];
      if (number < 100) {
        const tens = Math.floor(number / 10);
        const remainder = number % 10;
        return ones[tens] + "じゅう" + ones[remainder];
      }
      return String(number);
    }

    function hourToHiragana(hour) {
      const readings = {
        1: "いちじ", 2: "にじ", 3: "さんじ", 4: "よじ",
        5: "ごじ", 6: "ろくじ", 7: "しちじ", 8: "はちじ",
        9: "くじ", 10: "じゅうじ", 11: "じゅういちじ", 12: "じゅうにじ"
      };
      return readings[hour];
    }

    function minuteToHiragana(minute) {
      const special = {
        1: "いっぷん", 2: "にふん", 3: "さんぷん", 4: "よんぷん",
        5: "ごふん", 6: "ろっぷん", 7: "ななふん", 8: "はっぷん",
        9: "きゅうふん", 10: "じゅっぷん"
      };

      if (minute <= 10) return special[minute];

      const tens = Math.floor(minute / 10);
      const ones = minute % 10;
      const tensReading = numberToHiragana(tens) + "じゅう";

      if (ones === 0) return tensReading.replace("じゅう", "じゅっぷん");
      return tensReading + special[ones];
    }

    function clockAnswerToHiragana(hour, minute) {
      const hourText = hourToHiragana(hour);

      if (minute === 0) {
        return hourText;
      }

      if (minute === 30) {
        return `${hourText}　${minuteToHiragana(minute)}<br>${hourText}　はん`;
      }

      return `${hourText}　${minuteToHiragana(minute)}`;
    }

    function monthToHiragana(month) {
      const readings = {
        1: "いちがつ", 2: "にがつ", 3: "さんがつ", 4: "しがつ",
        5: "ごがつ", 6: "ろくがつ", 7: "しちがつ", 8: "はちがつ",
        9: "くがつ", 10: "じゅうがつ", 11: "じゅういちがつ", 12: "じゅうにがつ"
      };
      return readings[month];
    }

    function dayToHiragana(day) {
      const special = {
        1: "ついたち", 2: "ふつか", 3: "みっか", 4: "よっか",
        5: "いつか", 6: "むいか", 7: "なのか", 8: "ようか",
        9: "ここのか", 10: "とおか", 14: "じゅうよっか",
        20: "はつか", 24: "にじゅうよっか"
      };

      if (special[day]) return special[day];

      const lastDigit = day % 10;
      let base = numberToHiragana(day);

      if (lastDigit === 4) {
        base = base.replace(/よん$/, "よっ");
      }

      return base + "にち";
    }

    function setLineEnd(line, length, angleDegrees) {
      const angle = (angleDegrees - 90) * Math.PI / 180;
      line.setAttribute("x2", String(200 + Math.cos(angle) * length));
      line.setAttribute("y2", String(200 + Math.sin(angle) * length));
    }

    function buildClockFace() {
      const svgNS = "http://www.w3.org/2000/svg";

      for (let i = 0; i < 60; i += 1) {
        const angle = (i * 6 - 90) * Math.PI / 180;
        const isHour = i % 5 === 0;
        const outerRadius = 164;
        const innerRadius = isHour ? 147 : 155;

        const line = document.createElementNS(svgNS, "line");
        line.setAttribute("x1", String(200 + Math.cos(angle) * innerRadius));
        line.setAttribute("y1", String(200 + Math.sin(angle) * innerRadius));
        line.setAttribute("x2", String(200 + Math.cos(angle) * outerRadius));
        line.setAttribute("y2", String(200 + Math.sin(angle) * outerRadius));
        line.setAttribute("class", "clock-tick");
        line.setAttribute("stroke-width", isHour ? "4" : "2");
        elements.ticks.appendChild(line);
      }

      for (let number = 1; number <= 12; number += 1) {
        const angle = (number * 30 - 90) * Math.PI / 180;
        const text = document.createElementNS(svgNS, "text");
        text.setAttribute("x", String(200 + Math.cos(angle) * 124));
        text.setAttribute("y", String(200 + Math.sin(angle) * 124));
        text.setAttribute("class", "clock-number");
        text.textContent = String(number);
        elements.numbers.appendChild(text);
      }
    }

    function generateClockQuestion() {
      const step = Number(elements.minuteStep.value);
      let hour;
      let minute;
      let attempts = 0;

      do {
        hour = randomInt(1, 12);
        minute = step === 1 ? randomInt(0, 59) : randomInt(0, 11) * 5;
        attempts += 1;
      } while (
        state.currentClock &&
        state.currentClock.hour === hour &&
        state.currentClock.minute === minute &&
        attempts < 20
      );

      state.currentClock = { hour, minute };

      const minuteAngle = minute * 6;
      const hourAngle = (hour % 12) * 30 + minute * 0.5;

      setLineEnd(elements.minuteHand, 135, minuteAngle);
      setLineEnd(elements.hourHand, 94, hourAngle);

      elements.answerText.innerHTML = clockAnswerToHiragana(hour, minute);
      hideAnswer();
    }

    function daysInMonth(year, monthIndex) {
      return new Date(year, monthIndex + 1, 0).getDate();
    }

    function renderCalendar(year, monthIndex, targetDay) {
      const weekdays = ["日", "月", "火", "水", "木", "金", "土"];
      elements.calendarGrid.innerHTML = "";

      weekdays.forEach((name, index) => {
        const cell = document.createElement("div");
        cell.className = `weekday ${index === 0 ? "sun" : ""} ${index === 6 ? "sat" : ""}`.trim();
        cell.textContent = name;
        cell.setAttribute("role", "columnheader");
        elements.calendarGrid.appendChild(cell);
      });

      const firstWeekday = new Date(year, monthIndex, 1).getDay();
      const totalDays = daysInMonth(year, monthIndex);

      for (let i = 0; i < firstWeekday; i += 1) {
        const empty = document.createElement("div");
        empty.className = "day-cell empty";
        empty.setAttribute("aria-hidden", "true");
        elements.calendarGrid.appendChild(empty);
      }

      for (let day = 1; day <= totalDays; day += 1) {
        const date = new Date(year, monthIndex, day);
        const weekday = date.getDay();
        const cell = document.createElement("div");

        cell.className = [
          "day-cell",
          weekday === 0 ? "sun" : "",
          weekday === 6 ? "sat" : "",
          day === targetDay ? "highlight" : ""
        ].filter(Boolean).join(" ");

        cell.textContent = String(day);
        cell.setAttribute("role", "gridcell");

        if (day === targetDay) {
          cell.setAttribute("aria-label", `${year}年${monthIndex + 1}月${day}日、選択された日`);
        } else {
          cell.setAttribute("aria-label", `${year}年${monthIndex + 1}月${day}日`);
        }

        elements.calendarGrid.appendChild(cell);
      }

      elements.calendarMonth.textContent = `${monthIndex + 1}月`;
    }

    function generateCalendarQuestion() {
      const year = new Date().getFullYear();

      let monthIndex;
      let day;
      let attempts = 0;

      do {
        monthIndex = randomInt(0, 11);
        day = randomInt(1, daysInMonth(year, monthIndex));
        attempts += 1;
      } while (
        state.currentDate &&
        state.currentDate.year === year &&
        state.currentDate.monthIndex === monthIndex &&
        state.currentDate.day === day &&
        attempts < 20
      );

      state.currentDate = { year, monthIndex, day };
      renderCalendar(year, monthIndex, day);

      elements.answerText.textContent = `${monthToHiragana(monthIndex + 1)} ${dayToHiragana(day)}`;
      hideAnswer();
    }

    function generateQuestion() {
      if (state.mode === "clock") {
        generateClockQuestion();
      } else {
        generateCalendarQuestion();
      }
    }

    function hideAnswer() {
      state.answerVisible = false;
      elements.answerText.classList.add("hidden");
      elements.showAnswerButton.textContent = "答えを見る";
    }

    function toggleAnswer() {
      state.answerVisible = !state.answerVisible;
      elements.answerText.classList.toggle("hidden", !state.answerVisible);
      elements.showAnswerButton.textContent = state.answerVisible ? "答えを隠す" : "答えを見る";
    }

    function setMode(mode) {
      state.mode = mode;
      const isClock = mode === "clock";

      elements.clockModeButton.classList.toggle("active", isClock);
      elements.calendarModeButton.classList.toggle("active", !isClock);
      elements.clockModeButton.setAttribute("aria-pressed", String(isClock));
      elements.calendarModeButton.setAttribute("aria-pressed", String(!isClock));

      elements.clockSettings.hidden = !isClock;
      elements.clockView.hidden = !isClock;
      elements.calendarView.hidden = isClock;

      elements.questionTitle.textContent = isClock
        ? "なんじ　なんぷんですか"
        : "なんがつ　なんにちですか";

      generateQuestion();
    }

    elements.clockModeButton.addEventListener("click", () => setMode("clock"));
    elements.calendarModeButton.addEventListener("click", () => setMode("calendar"));
    elements.newQuestionButton.addEventListener("click", generateQuestion);
    elements.showAnswerButton.addEventListener("click", toggleAnswer);

    buildClockFace();
    generateClockQuestion();
  </script>
</body>
</html>
