<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>時計・カレンダー よみとり練習（ひらがな版）</title>
  <style>
    :root{--bg:#f4f7fb;--panel:#fff;--text:#1f2937;--muted:#667085;--line:#d0d5dd;--primary:#2563eb;--primary-dark:#1d4ed8;--accent:#f59e0b;--accent-soft:#fff3c4;--success:#0f766e;--shadow:0 10px 28px rgba(31,41,55,.10);--radius:18px}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:"BIZ UDPGothic","Yu Gothic","Meiryo",sans-serif;color:var(--text);background:radial-gradient(circle at top left,#e8f0ff 0,transparent 32%),linear-gradient(180deg,#f9fbff 0%,var(--bg) 100%)}button,select,input{font:inherit}.app{width:min(980px,calc(100% - 28px));margin:0 auto;padding:24px 0 40px}.app-header{text-align:center;margin-bottom:20px}.app-header h1{margin:0;font-size:clamp(1.6rem,4vw,2.4rem);letter-spacing:.04em}.app-header p{margin:8px 0 0;color:var(--muted);font-size:1rem}.mode-switch{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:18px}.mode-button{min-height:72px;border:2px solid transparent;border-radius:16px;background:var(--panel);color:var(--text);box-shadow:var(--shadow);cursor:pointer;font-weight:700;font-size:1.2rem;transition:transform .15s ease,border-color .15s ease,background .15s ease}.mode-button:hover{transform:translateY(-2px)}.mode-button.active{border-color:var(--primary);background:#eef4ff;color:var(--primary-dark)}.panel{background:var(--panel);border-radius:var(--radius);box-shadow:var(--shadow);padding:clamp(18px,3vw,30px)}.toolbar{display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between;margin-bottom:18px}.settings{display:flex;flex-wrap:wrap;gap:12px;align-items:end}.setting{display:grid;gap:6px}.setting label{color:var(--muted);font-size:.9rem;font-weight:700}.setting select{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff}.primary-button,.secondary-button{min-height:48px;border:none;border-radius:12px;padding:10px 22px;font-weight:800;cursor:pointer;transition:transform .15s ease,filter .15s ease}.primary-button{background:var(--primary);color:#fff}.secondary-button{background:#edf2f7;color:var(--text)}.primary-button:hover,.secondary-button:hover{transform:translateY(-1px);filter:brightness(.97)}.question-title{margin:0 0 14px;text-align:center;font-size:clamp(1.25rem,3vw,1.65rem)}.stage{min-height:470px;display:grid;place-items:center;border:2px dashed #dbe3ef;border-radius:16px;padding:18px;background:#fbfdff}.clock-wrap{width:min(520px,100%);aspect-ratio:1/1;display:grid;place-items:center}#clockSvg{width:100%;height:100%;overflow:visible}.clock-face{fill:#fff;stroke:#1f2937;stroke-width:5}.clock-tick{stroke:#475467;stroke-linecap:round}.clock-number{font-size:22px;font-weight:800;fill:#111827;text-anchor:middle;dominant-baseline:central}.hour-hand{stroke:#111827;stroke-width:10;stroke-linecap:round}.minute-hand{stroke:var(--primary);stroke-width:7;stroke-linecap:round}.center-dot{fill:var(--accent);stroke:#111827;stroke-width:2}.calendar-wrap{width:min(760px,100%)}.calendar-header{display:flex;justify-content:center;align-items:baseline;gap:10px;margin-bottom:14px;font-weight:900}.calendar-month{font-size:clamp(1.8rem,5vw,2.8rem)}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.weekday,.day-cell{min-height:52px;display:grid;place-items:center;border-radius:10px;font-weight:800}.weekday{color:var(--muted);background:#f1f5f9}.weekday.sun,.day-cell.sun{color:#c2410c}.weekday.sat,.day-cell.sat{color:#1d4ed8}.day-cell{position:relative;background:#fff;border:1px solid #e4e7ec;font-size:clamp(1rem,3vw,1.35rem)}.day-cell.empty{border-color:transparent;background:transparent}.day-cell.highlight{color:#111827;background:var(--accent-soft);border:3px solid var(--accent);animation:pulse 1s ease-in-out infinite alternate;z-index:1}.day-cell.highlight:after{content:"";position:absolute;inset:-7px;border:3px solid rgba(245,158,11,.35);border-radius:14px}@keyframes pulse{from{transform:scale(1);box-shadow:0 0 0 rgba(245,158,11,0)}to{transform:scale(1.05);box-shadow:0 0 24px rgba(245,158,11,.4)}}.answer-area{margin-top:16px;min-height:72px;display:grid;place-items:center;border-radius:14px;background:#f8fafc;text-align:center;padding:14px}.answer{margin:0;font-size:clamp(1.3rem,4vw,2rem);font-weight:900;color:var(--success)}.answer.hidden{visibility:hidden}.footer-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:16px}[hidden]{display:none!important}button:focus-visible,select:focus-visible{outline:4px solid rgba(37,99,235,.25);outline-offset:2px}@media(max-width:640px){.stage{min-height:390px;padding:10px}.toolbar{align-items:stretch}.settings{width:100%}.setting{flex:1 1 140px}.primary-button{width:100%}.weekday,.day-cell{min-height:43px}}
  </style>
</head>
<body>
<main class="app">
<header class="app-header"><h1>時計・カレンダー よみとり練習（ひらがな版）</h1><p>モードを選び、「問題を出す」を押してください。</p></header>
<section class="mode-switch" aria-label="練習モード"><button id="clockModeButton" class="mode-button active" type="button" aria-pressed="true">🕒 時計</button><button id="calendarModeButton" class="mode-button" type="button" aria-pressed="false">📅 カレンダー</button></section>
<section class="panel"><div class="toolbar"><div class="settings"><div id="clockSettings" class="setting"><label for="minuteStep">分の単位</label><select id="minuteStep"><option value="5" selected>5分単位</option><option value="1">1分単位</option></select></div></div><button id="newQuestionButton" class="primary-button" type="button">問題を出す</button></div>
<h2 id="questionTitle" class="question-title">なんじ　なんぷんですか</h2>
<div class="stage" aria-live="polite"><div id="clockView" class="clock-wrap"><svg id="clockSvg" viewBox="0 0 400 400" role="img" aria-label="アナログ時計"><circle class="clock-face" cx="200" cy="200" r="175"></circle><g id="ticks"></g><g id="numbers"></g><line id="hourHand" class="hour-hand" x1="200" y1="200" x2="200" y2="105"></line><line id="minuteHand" class="minute-hand" x1="200" y1="200" x2="200" y2="65"></line><circle class="center-dot" cx="200" cy="200" r="10"></circle></svg></div><div id="calendarView" class="calendar-wrap" hidden><div class="calendar-header"><span id="calendarMonth" class="calendar-month"></span></div><div id="calendarGrid" class="calendar-grid" role="grid" aria-label="カレンダー"></div></div></div>
<div class="answer-area"><p id="answerText" class="answer hidden">答え</p></div><div class="footer-actions"><button id="showAnswerButton" class="secondary-button" type="button">答えを見る</button></div></section></main>
<script>
"use strict";
const state={mode:"clock",currentClock:null,currentDate:null,answerVisible:false};
const elements={clockModeButton:document.getElementById("clockModeButton"),calendarModeButton:document.getElementById("calendarModeButton"),clockSettings:document.getElementById("clockSettings"),minuteStep:document.getElementById("minuteStep"),newQuestionButton:document.getElementById("newQuestionButton"),showAnswerButton:document.getElementById("showAnswerButton"),questionTitle:document.getElementById("questionTitle"),clockView:document.getElementById("clockView"),calendarView:document.getElementById("calendarView"),hourHand:document.getElementById("hourHand"),minuteHand:document.getElementById("minuteHand"),ticks:document.getElementById("ticks"),numbers:document.getElementById("numbers"),calendarMonth:document.getElementById("calendarMonth"),calendarGrid:document.getElementById("calendarGrid"),answerText:document.getElementById("answerText")};
function randomInt(min,max){return Math.floor(Math.random()*(max-min+1))+min}
function numberToHiragana(n){const o=["","いち","に","さん","よん","ご","ろく","なな","はち","きゅう"];if(n===0)return"れい";if(n<10)return o[n];if(n<20)return"じゅう"+o[n-10];if(n<100){const t=Math.floor(n/10),r=n%10;return o[t]+"じゅう"+o[r]}return String(n)}
function hourToHiragana(h){return({1:"いちじ",2:"にじ",3:"さんじ",4:"よじ",5:"ごじ",6:"ろくじ",7:"しちじ",8:"はちじ",9:"くじ",10:"じゅうじ",11:"じゅういちじ",12:"じゅうにじ"})[h]}
function minuteToHiragana(m){if(m===0)return"ちょうど";const s={1:"いっぷん",2:"にふん",3:"さんぷん",4:"よんぷん",5:"ごふん",6:"ろっぷん",7:"ななふん",8:"はっぷん",9:"きゅうふん",10:"じゅっぷん"};if(m<=10)return s[m];const t=Math.floor(m/10),u=m%10,b=numberToHiragana(t)+"じゅう";return u===0?b.replace("じゅう","じゅっぷん"):b+s[u]}
function monthToHiragana(m){return({1:"いちがつ",2:"にがつ",3:"さんがつ",4:"しがつ",5:"ごがつ",6:"ろくがつ",7:"しちがつ",8:"はちがつ",9:"くがつ",10:"じゅうがつ",11:"じゅういちがつ",12:"じゅうにがつ"})[m]}
function dayToHiragana(d){const s={1:"ついたち",2:"ふつか",3:"みっか",4:"よっか",5:"いつか",6:"むいか",7:"なのか",8:"ようか",9:"ここのか",10:"とおか",14:"じゅうよっか",20:"はつか",24:"にじゅうよっか"};if(s[d])return s[d];let b=numberToHiragana(d);if(d%10===4)b=b.replace(/よん$/,"よっ");return b+"にち"}
function setLineEnd(l,len,a){const r=(a-90)*Math.PI/180;l.setAttribute("x2",String(200+Math.cos(r)*len));l.setAttribute("y2",String(200+Math.sin(r)*len))}
function buildClockFace(){const ns="http://www.w3.org/2000/svg";for(let i=0;i<60;i++){const a=(i*6-90)*Math.PI/180,h=i%5===0,o=164,n=h?147:155,l=document.createElementNS(ns,"line");l.setAttribute("x1",String(200+Math.cos(a)*n));l.setAttribute("y1",String(200+Math.sin(a)*n));l.setAttribute("x2",String(200+Math.cos(a)*o));l.setAttribute("y2",String(200+Math.sin(a)*o));l.setAttribute("class","clock-tick");l.setAttribute("stroke-width",h?"4":"2");elements.ticks.appendChild(l)}for(let n=1;n<=12;n++){const a=(n*30-90)*Math.PI/180,t=document.createElementNS(ns,"text");t.setAttribute("x",String(200+Math.cos(a)*124));t.setAttribute("y",String(200+Math.sin(a)*124));t.setAttribute("class","clock-number");t.textContent=String(n);elements.numbers.appendChild(t)}}
function generateClockQuestion(){const step=Number(elements.minuteStep.value);let h,m,a=0;do{h=randomInt(1,12);m=step===1?randomInt(0,59):randomInt(0,11)*5;a++}while(state.currentClock&&state.currentClock.hour===h&&state.currentClock.minute===m&&a<20);state.currentClock={hour:h,minute:m};setLineEnd(elements.minuteHand,135,m*6);setLineEnd(elements.hourHand,94,(h%12)*30+m*.5);elements.answerText.textContent=`${hourToHiragana(h)} ${minuteToHiragana(m)}`;hideAnswer()}
function daysInMonth(y,m){return new Date(y,m+1,0).getDate()}
function renderCalendar(y,m,target){const w=["日","月","火","水","木","金","土"];elements.calendarGrid.innerHTML="";w.forEach((n,i)=>{const c=document.createElement("div");c.className=`weekday ${i===0?"sun":""} ${i===6?"sat":""}`.trim();c.textContent=n;c.setAttribute("role","columnheader");elements.calendarGrid.appendChild(c)});const first=new Date(y,m,1).getDay(),total=daysInMonth(y,m);for(let i=0;i<first;i++){const e=document.createElement("div");e.className="day-cell empty";e.setAttribute("aria-hidden","true");elements.calendarGrid.appendChild(e)}for(let d=1;d<=total;d++){const wd=new Date(y,m,d).getDay(),c=document.createElement("div");c.className=["day-cell",wd===0?"sun":"",wd===6?"sat":"",d===target?"highlight":""].filter(Boolean).join(" ");c.textContent=String(d);c.setAttribute("role","gridcell");c.setAttribute("aria-label",`${m+1}月${d}日${d===target?"、選択された日":""}`);elements.calendarGrid.appendChild(c)}elements.calendarMonth.textContent=`${m+1}月`}
function generateCalendarQuestion(){const y=new Date().getFullYear();let m,d,a=0;do{m=randomInt(0,11);d=randomInt(1,daysInMonth(y,m));a++}while(state.currentDate&&state.currentDate.monthIndex===m&&state.currentDate.day===d&&a<20);state.currentDate={year:y,monthIndex:m,day:d};renderCalendar(y,m,d);elements.answerText.textContent=`${monthToHiragana(m+1)} ${dayToHiragana(d)}`;hideAnswer()}
function generateQuestion(){state.mode==="clock"?generateClockQuestion():generateCalendarQuestion()}
function hideAnswer(){state.answerVisible=false;elements.answerText.classList.add("hidden");elements.showAnswerButton.textContent="答えを見る"}
function toggleAnswer(){state.answerVisible=!state.answerVisible;elements.answerText.classList.toggle("hidden",!state.answerVisible);elements.showAnswerButton.textContent=state.answerVisible?"答えを隠す":"答えを見る"}
function setMode(mode){state.mode=mode;const c=mode==="clock";elements.clockModeButton.classList.toggle("active",c);elements.calendarModeButton.classList.toggle("active",!c);elements.clockModeButton.setAttribute("aria-pressed",String(c));elements.calendarModeButton.setAttribute("aria-pressed",String(!c));elements.clockSettings.hidden=!c;elements.clockView.hidden=!c;elements.calendarView.hidden=c;elements.questionTitle.textContent=c?"なんじ　なんぷんですか":"なんがつ　なんにちですか";generateQuestion()}
elements.clockModeButton.addEventListener("click",()=>setMode("clock"));elements.calendarModeButton.addEventListener("click",()=>setMode("calendar"));elements.newQuestionButton.addEventListener("click",generateQuestion);elements.showAnswerButton.addEventListener("click",toggleAnswer);buildClockFace();generateClockQuestion();
</script></body></html>
