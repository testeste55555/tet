<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UDデジタル教科書体 フォント確認</title>
<style>
body{font-family:system-ui,"Yu Gothic",Meiryo,sans-serif;max-width:900px;margin:0 auto;padding:24px;color:#1f2937;background:#f4f7fb}
main{background:#fff;border-radius:16px;padding:24px;box-shadow:0 8px 28px #00000014}
h1{font-size:1.5rem;margin-top:0}button{font:inherit;font-size:1.05rem;padding:12px 18px;border:0;border-radius:10px;background:#2563eb;color:#fff;cursor:pointer}pre{white-space:pre-wrap;word-break:break-word;background:#f8fafc;border:1px solid #d8e0ea;border-radius:10px;padding:14px;min-height:100px}.note{color:#667085;line-height:1.7}.ok{color:#047857;font-weight:700}.ng{color:#b42318;font-weight:700}</style>
</head>
<body>
<main>
<h1>UDデジタル教科書体 フォント確認</h1>
<p class="note">このページは、PCに入っているフォント名を確認するためだけの診断ページです。ボタンを押すと、Chromeから「ローカルフォントへのアクセス」を求められる場合があります。その場合は許可してください。</p>
<button id="check">ローカルフォントを確認</button>
<p id="status"></p>
<pre id="out">まだ確認していません。</pre>
</main>
<script>
const btn=document.getElementById('check'),statusEl=document.getElementById('status'),out=document.getElementById('out');
btn.addEventListener('click',async()=>{
  statusEl.textContent='確認中…'; out.textContent='';
  if(!('queryLocalFonts' in window)){
    statusEl.className='ng'; statusEl.textContent='このブラウザでは Local Font Access API を利用できません。';
    out.textContent='Chrome / Edge のデスクトップ版で確認してください。'; return;
  }
  try{
    const fonts=await window.queryLocalFonts();
    const hit=fonts.filter(f=>{
      const s=[f.family,f.fullName,f.postscriptName,f.style].filter(Boolean).join(' ').toLowerCase();
      return s.includes('kyokasho')||s.includes('digi')||s.includes('教科書')||s.includes('ud digital')||s.includes('ud デジタル');
    });
    if(!hit.length){
      statusEl.className='ng'; statusEl.textContent='UDデジタル教科書体に該当するフォント名を取得できませんでした。';
      out.textContent='取得フォント数: '+fonts.length+'\nUD / Digi / Kyokasho / 教科書 に一致する項目なし'; return;
    }
    statusEl.className='ok'; statusEl.textContent='該当フォントが見つかりました。下の結果をそのまま共有してください。';
    out.textContent=hit.map((f,i)=>[
      '['+(i+1)+']',
      'family: '+f.family,
      'fullName: '+f.fullName,
      'postscriptName: '+f.postscriptName,
      'style: '+f.style
    ].join('\n')).join('\n\n');
  }catch(e){
    statusEl.className='ng'; statusEl.textContent='フォント情報を取得できませんでした。';
    out.textContent=(e&&e.name?e.name+': ':'')+(e&&e.message?e.message:String(e));
  }
});
</script>
</body>
</html>
