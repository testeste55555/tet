<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="時計とカレンダーの読み取りを練習する教育用アプリです。" />
  <title>時計・カレンダー よみとり練習</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #667085;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --accent: #0f766e;
      --shadow: 0 12px 32px rgba(31, 41, 55, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "UD Digi Kyokasho N-R", "UD デジタル 教科書体 N-R", "UDデジタル教科書体 N-R", "BIZ UDPGothic", "Yu Gothic", "Meiryo", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, #e8f0ff 0, transparent 34%),
        linear-gradient(180deg, #f9fbff 0%, var(--bg) 100%);
    }

    main {
      width: min(820px, 100%);
    }

    header {
      text-align: center;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 5vw, 2.7rem);
      letter-spacing: 0.04em;
    }

    header p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: clamp(1rem, 2.5vw, 1.15rem);
    }

    .versions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .version-card {
      display: grid;
      gap: 14px;
      min-height: 230px;
      padding: 28px;
      border: 3px solid transparent;
      border-radius: 20px;
      background: var(--panel);
      box-shadow: var(--shadow);
      color: inherit;
      text-decoration: none;
      transition: transform 0.18s ease, border-color 0.18s ease;
    }

    .version-card:hover,
    .version-card:focus-visible {
      transform: translateY(-4px);
      border-color: var(--primary);
    }

    .icon {
      font-size: 3rem;
      line-height: 1;
    }

    h2 {
      margin: 0;
      font-size: 1.6rem;
    }

    .example {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
    }

    .open-label {
      align-self: end;
      justify-self: start;
      padding: 10px 16px;
      border-radius: 999px;
      background: var(--primary);
      color: white;
      font-weight: 800;
    }

    .version-card:last-child .open-label {
      background: var(--accent);
    }

    footer {
      margin-top: 22px;
      text-align: center;
      color: var(--muted);
      font-size: 0.92rem;
    }

    @media (max-width: 640px) {
      .versions {
        grid-template-columns: 1fr;
      }

      .version-card {
        min-height: 190px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>時計・カレンダー よみとり練習</h1>
      <p>こたえの表示方法を選んでください。</p>
    </header>

    <section class="versions" aria-label="アプリの種類">
      <a class="version-card" href="./hiragana.html">
        <span class="icon" aria-hidden="true">あ</span>
        <h2>ひらがな版</h2>
        <p class="example">
          「さんじ　じゅうごふん」<br />
          「はちがつ　いつか」
        </p>
        <span class="open-label">ひらく</span>
      </a>

      <a class="version-card" href="./kanji.html">
        <span class="icon" aria-hidden="true">漢</span>
        <h2>漢字版</h2>
        <p class="example">
          「3時15分」<br />
          「8月5日」
        </p>
        <span class="open-label">開く</span>
      </a>
    </section>

    <footer>
      インターネット上でも、ダウンロード後のローカル環境でも動作します。
    </footer>
  </main>
</body>
</html>
